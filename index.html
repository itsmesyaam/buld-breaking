<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080e">
<title>Leave the Lamp Alone — The Automatic Repair Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CSS: DESIGN SYSTEM & COZY STORYBOOK STYLES
   ========================================================================== */
:root {
  --bg-night: #04060a;
  --sky-top: #050814;
  --sky-bot: #0d1527;
  --gold: #ffbe53;
  --amber: #f59e0b;
  --amber-glow: rgba(255, 190, 83, 0.45);
  --ink: #eef2f6;
  --ink-dim: #94a3b8;
  --card-glass: rgba(15, 23, 42, 0.72);
  --card-border: rgba(255, 255, 255, 0.12);
  --accent-blue: #38bdf8;
  --font-display: 'Fredoka', cursive, system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --speed-mult: 1;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-night);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Screen reader announcer */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ==========================================================================
   STAGE & RESPONSIVE CONTAINER
   ========================================================================== */
#viewport-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

#stage {
  position: relative;
  width: min(100vw - 24px, calc((100vh - 24px) * 1.7778));
  height: min(100vh - 24px, calc((100vw - 24px) * 0.5625));
  max-width: 1280px;
  max-height: 720px;
  aspect-ratio: 16 / 9;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 75%, #0c1017 100%);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 25px 80px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
}

@media (max-aspect-ratio: 1/1), (max-width: 650px) {
  #stage {
    width: min(100vw - 16px, calc((100vh - 16px) * 0.8));
    height: min(100vh - 16px, calc((100vw - 16px) * 1.25));
    aspect-ratio: 4 / 5;
  }
}

/* ==========================================================================
   LIGHTING HERO OVERLAYS
   ========================================================================== */
#darkness-layer {
  position: absolute;
  inset: 0;
  background: rgba(3, 5, 10, 0.86);
  pointer-events: none;
  z-index: 25;
  transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0.82;
}

#stage.lamp-lit #darkness-layer {
  opacity: 0.12;
}

#light-bloom {
  position: absolute;
  top: 14%;
  left: 36%;
  width: 75%;
  height: 90%;
  transform: translate(-50%, -10%);
  background: radial-gradient(circle at 48% 28%, rgba(255, 204, 112, 0.42) 0%, rgba(255, 180, 70, 0.22) 35%, rgba(255, 160, 40, 0.08) 55%, transparent 75%);
  pointer-events: none;
  z-index: 26;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}

#stage.lamp-lit #light-bloom {
  opacity: 1;
}

/* Flash effect upon bulb popping */
#flash-fx {
  position: absolute;
  inset: 0;
  background: #fff9ea;
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  transition: opacity 0.05s ease-out;
}
#flash-fx.popping {
  opacity: 0.95;
}

/* ==========================================================================
   HUD: GLASSMORPHISM TOP PILL & STATS
   ========================================================================== */
.hud-glass {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 50;
  pointer-events: none;
}

.hud-left, .hud-right {
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
}

.pill-card {
  background: var(--card-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--card-border);
  padding: 8px 14px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}

.status-chip {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s ease;
}

.status-chip.lit {
  color: #4ade80;
  background: rgba(74, 222, 128, 0.15);
  border-color: rgba(74, 222, 128, 0.35);
}
.status-chip.broken {
  color: #f87171;
  background: rgba(248, 113, 113, 0.18);
  border-color: rgba(248, 113, 113, 0.4);
}
.status-chip.repairing {
  color: #facc15;
  background: rgba(250, 204, 21, 0.18);
  border-color: rgba(250, 204, 21, 0.4);
  animation: pulse-border 1.5s infinite;
}

@keyframes pulse-border {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.btn-ctrl {
  background: var(--card-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
  pointer-events: auto;
}

.btn-ctrl:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-1px);
}
.btn-ctrl:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.btn-ctrl:active:not(:disabled) {
  transform: translateY(1px);
}
.btn-ctrl.btn-highlight {
  background: rgba(255, 190, 83, 0.18);
  border-color: rgba(255, 190, 83, 0.45);
  color: var(--gold);
}
.btn-ctrl.btn-highlight:hover:not(:disabled) {
  background: rgba(255, 190, 83, 0.32);
}
.btn-ctrl:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

/* ==========================================================================
   BOTTOM TOOLBAR: THROWABLES & COUNTERS
   ========================================================================== */
.hud-bottom {
  position: absolute;
  bottom: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 50;
  pointer-events: none;
}

.stats-tally {
  background: var(--card-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  padding: 7px 14px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-size: 11.5px;
  color: var(--ink-dim);
  pointer-events: auto;
}
.stats-tally b {
  color: var(--ink);
  font-weight: 700;
}
.invoice-badge {
  color: #34d399 !important;
  font-family: ui-monospace, SFMono-Regular, monospace;
}

.throw-tools-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  padding: 5px;
  border-radius: 999px;
  pointer-events: auto;
  position: relative;
}

.tool-opt {
  background: transparent;
  border: 1px solid transparent;
  color: var(--ink-dim);
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s ease;
}
.tool-opt:hover:not(:disabled) {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.08);
}
.tool-opt.active {
  background: rgba(255, 190, 83, 0.22);
  border-color: rgba(255, 190, 83, 0.5);
  color: var(--gold);
}
.tool-opt:focus-visible {
  outline: 2px solid var(--gold);
}
.tool-opt:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.tooltip-notice {
  position: absolute;
  top: -34px;
  right: 10px;
  background: rgba(15, 23, 42, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--gold);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: all 0.2s ease;
}
.throw-tools-wrap.blocked:hover .tooltip-notice {
  opacity: 1;
  transform: translateY(0);
}

/* ==========================================================================
   SPEECH BUBBLES
   ========================================================================== */
.speech-bubble {
  position: absolute;
  background: #ffffff;
  color: #0f172a;
  padding: 9px 14px;
  border-radius: 14px;
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(15, 23, 42, 0.15);
  pointer-events: none;
  z-index: 55;
  opacity: 0;
  transform: scale(0.85) translateY(6px);
  transition: opacity 0.25s cubic-bezier(0.2, 0, 0, 1), transform 0.25s cubic-bezier(0.2, 0, 0, 1);
  max-width: 210px;
}
.speech-bubble.active {
  opacity: 1;
  transform: scale(1) translateY(0);
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -9px;
  left: 22px;
  border-width: 10px 9px 0 9px;
  border-style: solid;
  border-color: #ffffff transparent transparent transparent;
}
.speech-bubble.bob-bubble::after {
  left: auto;
  right: 22px;
}

/* Phone UI Overlay */
#phone-overlay {
  position: absolute;
  bottom: 22%;
  left: 22%;
  background: #111827;
  border: 2px solid #374151;
  border-radius: 16px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 56;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}
#phone-overlay.calling {
  opacity: 1;
  transform: scale(1) translateY(0);
}
.phone-pulse {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 rgba(34, 197, 94, 0.5);
  animation: phone-ring 1.2s infinite;
}
@keyframes phone-ring {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8); }
  70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.phone-info {
  display: flex;
  flex-direction: column;
}
.phone-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: #9ca3af;
  letter-spacing: 0.05em;
}
.phone-contact {
  font-size: 12.5px;
  font-weight: 700;
  color: #f3f4f6;
}

/* End Card */
#end-card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 24px;
  padding: 24px 32px;
  text-align: center;
  z-index: 65;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
#end-card.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
#end-card h2 {
  font-family: var(--font-display);
  font-size: 26px;
  color: var(--gold);
  margin-bottom: 6px;
}
#end-card p {
  font-size: 13.5px;
  color: var(--ink-dim);
  margin-bottom: 18px;
}

/* ==========================================================================
   CANVAS & VECTOR SCENE GRAPH
   ========================================================================== */
#fx-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 40;
  pointer-events: auto;
  cursor: crosshair;
}
#stage.repairing #fx-canvas {
  cursor: default;
}

/* SVG Scene Layers */
.scene-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

/* CSS Animated Components (Van, Ladder, Characters) */
#electrician-van {
  position: absolute;
  bottom: 12.5%;
  right: -320px;
  width: 250px;
  height: 130px;
  z-index: 18;
  transform: translateX(0);
  transition: transform 2.8s cubic-bezier(0.3, 0.05, 0.1, 1);
  pointer-events: none;
}
#electrician-van.drive-in {
  transform: translateX(-430px);
}
#electrician-van.drive-away {
  transform: translateX(-1500px);
  transition: transform 3.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.van-headlight {
  position: absolute;
  left: -90px;
  top: 55px;
  width: 140px;
  height: 70px;
  background: radial-gradient(ellipse at 100% 50%, rgba(255, 235, 160, 0.6) 0%, rgba(255, 220, 100, 0.15) 50%, transparent 80%);
  transform-origin: right center;
  pointer-events: none;
  opacity: 0.85;
}

/* Folding Ladder */
#folding-ladder {
  position: absolute;
  bottom: 14%;
  left: 36%;
  width: 52px;
  height: 140px;
  z-index: 19;
  opacity: 0;
  transform: translateY(20px) scale(0.9);
  transition: all 0.4s ease;
  pointer-events: none;
}
#folding-ladder.placed {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Arthur Character container */
#actor-arthur {
  position: absolute;
  bottom: 14.5%;
  left: 17%;
  width: 50px;
  height: 100px;
  z-index: 20;
  transform: translateX(0);
  transition: transform 1.2s ease, opacity 0.5s ease;
  pointer-events: none;
}
#actor-arthur.inside {
  opacity: 0;
  transform: translateX(-35px);
}

/* Bob Character container */
#actor-bob {
  position: absolute;
  bottom: 14.5%;
  left: 56%;
  width: 54px;
  height: 108px;
  z-index: 21;
  opacity: 0;
  transform: translateX(40px);
  transition: all 0.6s ease;
  pointer-events: none;
}
#actor-bob.visible {
  opacity: 1;
  transform: translateX(0);
}
#actor-bob.on-ladder {
  left: 36%;
  bottom: 27%;
  transform: translateY(-8px);
}

/* Front Door Opening Spill */
#door-light-spill {
  position: absolute;
  bottom: 14.2%;
  left: 14.2%;
  width: 48px;
  height: 116px;
  background: linear-gradient(90deg, #ffc976 0%, rgba(255, 201, 118, 0.25) 75%, transparent 100%);
  opacity: 0;
  z-index: 12;
  transition: opacity 0.4s ease;
  pointer-events: none;
  filter: blur(2px);
}
#door-light-spill.open {
  opacity: 0.9;
}

/* Prefers Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<div id="viewport-wrapper">
  <div id="stage" class="lamp-lit">
    
    <!-- Accessibility Live Region for Story Beat Narration -->
    <div id="story-announcer" class="sr-only" aria-live="polite" aria-atomic="true">
      The porch lamp is glowing peacefully.
    </div>

    <!-- Ambient Lighting & FX Overlays -->
    <div id="darkness-layer"></div>
    <div id="light-bloom"></div>
    <div id="flash-fx"></div>

    <!-- Top HUD Glassmorphism Pill -->
    <header class="hud-glass">
      <div class="hud-left">
        <div class="pill-card">
          <span class="status-chip lit" id="status-chip">
            <span class="dot"></span> <span id="status-chip-text">💡 All Good</span>
          </span>
        </div>
      </div>
      <div class="hud-right">
        <button id="btn-replay" class="btn-ctrl btn-highlight" type="button" aria-label="Replay scripted story">
          <span>🔄 Replay Story</span>
        </button>
        <button id="btn-mode" class="btn-ctrl" type="button" aria-label="Toggle Mode">
          <span id="mode-text">🎮 Free Play</span>
        </button>
        <button id="btn-skip" class="btn-ctrl" type="button" aria-label="Fast forward repair" disabled>
          <span>Skip repair ⏩</span>
        </button>
        <button id="btn-sound" class="btn-ctrl" type="button" aria-label="Toggle Sound">
          <span id="sound-text">🔊 Sound: Off</span>
        </button>
      </div>
    </header>

    <!-- Bottom HUD: Statistics Tally & Throwables Selector -->
    <footer class="hud-bottom">
      <div class="stats-tally">
        <span>Shots: <b id="stat-shots">0</b></span>
        <span>Bulbs Broken: <b id="stat-broken">0</b></span>
        <span>Repairs: <b id="stat-repairs">0</b></span>
        <span>Invoice: <b id="stat-invoice" class="invoice-badge">₹0</b></span>
      </div>

      <div class="throw-tools-wrap" id="tools-picker">
        <button class="tool-opt active" data-tool="wrench" aria-label="Select Wrench (breaks in 2 hits)">
          <span>🔧 Wrench (2 hits)</span>
        </button>
        <button class="tool-opt" data-tool="hammer" aria-label="Select Hammer (breaks in 1 hit)">
          <span>🔨 Hammer (1 hit)</span>
        </button>
        <button class="tool-opt" data-tool="pebble" aria-label="Select Pebble (breaks in 3 hits)">
          <span>🪨 Pebble (3 hits)</span>
        </button>
        <div class="tooltip-notice" id="tool-blocked-tip">Bob is working…</div>
      </div>
    </footer>

    <!-- Dialogue Speech Bubbles -->
    <div id="bubble-arthur" class="speech-bubble" style="bottom: 30%; left: 16%;">
      <span class="type-target">Oh no… not again!</span>
    </div>
    <div id="bubble-bob" class="speech-bubble bob-bubble" style="bottom: 33%; left: 40%;">
      <span class="type-target">On my way!</span>
    </div>

    <!-- Interactive Phone Overlay -->
    <div id="phone-overlay">
      <div class="phone-pulse"></div>
      <div class="phone-info">
        <span class="phone-label">Calling</span>
        <span class="phone-contact">Bob ⚡ Electrician</span>
      </div>
    </div>

    <!-- Story Mode End Card -->
    <div id="end-card">
      <h2>The End</h2>
      <p>Percussive maintenance saves the day once again.</p>
      <button id="btn-end-freeplay" class="btn-ctrl btn-highlight" style="padding: 10px 22px; font-size: 13px;">
        🎮 Try Free Play Mode
      </button>
    </div>

    <!-- Interior Light Door Spill -->
    <div id="door-light-spill"></div>

    <!-- ====================================================================
         SCENE VECTOR GRAPHICS (SVG)
         ==================================================================== -->
    <svg class="scene-svg" viewBox="0 0 1000 562.5" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- Starry Sky & Moon -->
      <g id="sky-stars">
        <circle cx="120" cy="45" r="1.2" fill="#fff" opacity="0.6"/>
        <circle cx="210" cy="78" r="1.5" fill="#fff" opacity="0.8"/>
        <circle cx="340" cy="35" r="1.1" fill="#fff" opacity="0.5"/>
        <circle cx="480" cy="90" r="1.4" fill="#fff" opacity="0.7"/>
        <circle cx="620" cy="50" r="1.6" fill="#fff" opacity="0.9"/>
        <circle cx="750" cy="85" r="1.3" fill="#fff" opacity="0.6"/>
        <circle cx="890" cy="40" r="1.5" fill="#fff" opacity="0.8"/>
        <circle cx="950" cy="70" r="1.2" fill="#fff" opacity="0.5"/>
      </g>
      <!-- Crescent Moon -->
      <g transform="translate(850, 75)">
        <path d="M 0 0 A 24 24 0 1 0 32 32 A 28 28 0 1 1 0 0 Z" fill="#fffbe8" opacity="0.92" filter="drop-shadow(0 0 12px rgba(255,250,220,0.5))"/>
      </g>

      <!-- Distant Hills & Trees Silhouette -->
      <path d="M 0 460 Q 200 440 400 455 T 800 450 Q 920 445 1000 460 L 1000 562.5 L 0 562.5 Z" fill="#060911"/>

      <!-- Arthur's House Porch (Left) -->
      <!-- House Wall -->
      <rect x="0" y="80" width="280" height="400" fill="#131b2e"/>
      <path d="M 0 80 L 300 80 L 280 150 L 0 150 Z" fill="#0f1624"/>
      <!-- Siding plank lines -->

  CALLING: 'CALLING',

  soundEnabled: false,

/* ==========================================================================
   3. PROCEDURAL WEB AUDIO API SYNTHESIZER
   ========================================================================== */
let audioCtx = null;
let masterGain = null;
let noiseBuffer = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.55, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);

    // 1-second white noise buffer for clicks and shatter bursts
    noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const channelData = noiseBuffer.getChannelData(0);
    for (let i = 0; i < channelData.length; i++) {
      channelData[i] = Math.random() * 2 - 1;
    }
  } catch (err) {
    console.warn('Web Audio API not supported', err);
  }
}

const isAudioActive = () => STATE.soundEnabled && audioCtx && audioCtx.state === 'running';

function playTone(type, startFreq, endFreq, duration, volume, delay = 0) {
  if (!isAudioActive() || volume <= 0.0001) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(Math.max(1, startFreq), t);
  if (endFreq && endFreq > 0) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), t + duration);
  }
  gain.gain.setValueAtTime(Math.max(0.0001, volume), t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(t);
  osc.stop(t + duration + 0.04);
}

function playNoise(duration, volume, filterType, filterFreq, delay = 0) {
  if (!isAudioActive() || volume <= 0.0001 || !noiseBuffer) return;
  const t = audioCtx.currentTime + delay;
  const src = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();
  src.buffer = noiseBuffer;
  filter.type = filterType;
  filter.frequency.value = filterFreq;
  gain.gain.setValueAtTime(Math.max(0.0001, volume), t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start(t);
  src.stop(t + duration + 0.04);
}

const SFX = {
  shatter() {
    playNoise(0.45, 0.5, 'highpass', 1600);
    playNoise(0.2, 0.35, 'lowpass', 450);
    for (let i = 0; i < 8; i++) {

    }

  clink() {
    playTone('sine', 2600 + Math.random() * 800, 1800, 0.08, 0.14);
    playNoise(0.04, 0.1, 'bandpass', 3200);
  },
  phoneRing() {
    // Standard European/US telephone double-cadence
    playTone('sine', 440, 0, 0.35, 0.12, 0);
    playTone('sine', 480, 0, 0.35, 0.12, 0);
    playTone('sine', 440, 0, 0.35, 0.12, 0.5);
    playTone('sine', 480, 0, 0.35, 0.12, 0.5);
  },
  vanEngine() {
    // Low frequency engine hum sweep
    playTone('sawtooth', 65, 110, 1.4, 0.12);
    playNoise(1.2, 0.09, 'lowpass', 240);
  },
  vanStop() {
    playNoise(0.4, 0.14, 'bandpass', 1200); // Brake squeak
    playTone('triangle', 90, 45, 0.25, 0.1);
  },
  ladderClank() {
    [720, 1450, 2200].forEach((f, i) => {
      playTone('sine', f, 0, 0.4 - i * 0.08, 0.12 / (i + 1));
    });
    playNoise(0.06, 0.12, 'highpass', 2800);
  },
  screwSqueak() {
    playTone('sine', 2100, 2600, 0.16, 0.09);
    playTone('triangle', 1800, 2400, 0.16, 0.05);
  },
  sparkle() {
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
      playTone('sine', freq, 0, 0.35, 0.08, idx * 0.07);
    });
  },
  switchClick() {
    playTone('square', 2200, 300, 0.03, 0.12);
    playNoise(0.02, 0.14, 'highpass', 3500);
    playTone('square', 1400, 200, 0.03, 0.08, 0.03);
  },
  lightHum() {
    playTone('sine', 60, 60, 1.8, 0.12);
    playTone('sine', 120, 120, 1.2, 0.06);
  }
};

/* ==========================================================================

function wait(ms, signal) {
  return new Promise((resolve, reject) => {
    const adjustedMs = ms / STATE.speedMultiplier;
    const timer = setTimeout(resolve, adjustedMs);
    if (signal) {
      signal.addEventListener('abort', () => {
        clearTimeout(timer);
        reject(new DOMException('Aborted', 'AbortError'));
      }, { once: true });
    }
  });
}

function showSpeechBubble(bubbleEl, text, duration = 3000) {
  const target = bubbleEl.querySelector('.type-target');
  target.textContent = '';
  bubbleEl.classList.add('active');

  let idx = 0;
  const speed = 26 / STATE.speedMultiplier;
  clearInterval(bubbleEl._interval);
  bubbleEl._interval = setInterval(() => {
    if (idx < text.length) {
      target.textContent += text[idx];
      idx++;
    } else {
      clearInterval(bubbleEl._interval);
    }
  }, speed);

  clearTimeout(bubbleEl._hideTimeout);
  if (duration > 0) {
    bubbleEl._hideTimeout = setTimeout(() => {
      bubbleEl.classList.remove('active');
    }, duration / STATE.speedMultiplier);
  }
}

function hideSpeechBubbles() {
  bubbleArthur.classList.remove('active');
  bubbleBob.classList.remove('active');
}

function updateHUDStatus(text, typeClass) {
  statusChipEl.className = 'status-chip ' + typeClass;
  statusChipTextEl.textContent = text;
  announcerEl.textContent = text;
}

/* ==========================================================================
   6. SCENE & CHARACTER ANIMATION HELPERS
   ========================================================================== */
function setBulbVisualState(isLit, crackLevel = 0) {
  if (isLit) {
    stageEl.classList.add('lamp-lit');
    bulbGlass.setAttribute('fill', '#fffae6');
    bulbGlass.setAttribute('opacity', '0.95');
    bulbGlass.setAttribute('filter', 'drop-shadow(0 0 16px rgba(255,190,80,0.85))');
    bulbFilament.setAttribute('stroke', '#ea580c');
    bulbFilament.setAttribute('opacity', '1');
    shadeInnerGlow.setAttribute('opacity', '0.45');
    switchLever.setAttribute('y', '356');
  } else {
    stageEl.classList.remove('lamp-lit');
    bulbGlass.setAttribute('fill', '#2d3748');
    bulbGlass.setAttribute('opacity', '0.4');
    bulbGlass.removeAttribute('filter');
    bulbFilament.setAttribute('opacity', '0');
    shadeInnerGlow.setAttribute('opacity', '0.04');
    switchLever.setAttribute('y', '364');
  }

  // Cracks
  crackStage1.setAttribute('opacity', crackLevel >= 1 ? '1' : '0');
  crackStage2.setAttribute('opacity', crackLevel >= 2 ? '1' : '0');
}

function triggerBulbPopFlash() {
  flashFx.classList.add('popping');
  setTimeout(() => flashFx.classList.remove('popping'), 100);
}

/* ==========================================================================
   7. AUTOMATIC REPAIR LOOP (STATE MACHINE & SCRIPTED TIMELINE)
   ========================================================================== */
async function runRepairLoop() {
  if (STATE.isRepairing) return;
  STATE.isRepairing = true;
  STATE.speedMultiplier = 1;
  btnSkipEl.disabled = false;
  stageEl.classList.add('repairing');
  toolsPickerEl.classList.add('blocked');
  document.querySelectorAll('.tool-opt').forEach(btn => btn.disabled = true);

  // Setup AbortController for clean cancelation on replay
  if (STATE.timelineAbortCtrl) STATE.timelineAbortCtrl.abort();
  STATE.timelineAbortCtrl = new AbortController();
  const signal = STATE.timelineAbortCtrl.signal;

  try {
    // ------------------------------------------------------------------------
    // 1. BROKEN (0 - 1s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.BROKEN;
    STATE.bulbHealth = 0;
    STATE.bulbsBroken++;
    statBrokenEl.textContent = STATE.bulbsBroken;
    setBulbVisualState(false, 2);
    triggerBulbPopFlash();
    spawnGlassShards(360, 298);
    SFX.shatter();
    updateHUDStatus('💥 Bulb Shattered!', 'broken');

    await wait(CONFIG.timings.brokenDuration, signal);

    // ------------------------------------------------------------------------
    // 2. NOTICED (1 - 2.5s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.NOTICED;
    updateHUDStatus('🚪 Arthur Noticed', 'repairing');

    // Arthur steps outside; door opens
    doorSpill.classList.add('open');
    svgDoorLeaf.setAttribute('transform', 'scale(0.2, 1)');
    actorArthur.classList.remove('inside');

    await wait(CONFIG.timings.noticedDuration * 0.4, signal);
    showSpeechBubble(bubbleArthur, 'Oh no… not again!', CONFIG.timings.noticedDuration * 0.6);

    await wait(CONFIG.timings.noticedDuration * 0.6, signal);

    // ------------------------------------------------------------------------
    // 3. CALLING (2.5 - 5s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.CALLING;
    updateHUDStatus('📞 Calling Electrician…', 'repairing');
    phoneOverlay.classList.add('calling');
    SFX.phoneRing();

    await wait(CONFIG.timings.callingDuration * 0.5, signal);
    showSpeechBubble(bubbleBob, 'On my way!', CONFIG.timings.callingDuration * 0.5);

    await wait(CONFIG.timings.callingDuration * 0.5, signal);
    phoneOverlay.classList.remove('calling');
    hideSpeechBubbles();

    // ------------------------------------------------------------------------
    // 4. EN_ROUTE (5 - 8s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.EN_ROUTE;
    updateHUDStatus('🚐 Bob is En Route…', 'repairing');
    electricianVan.classList.remove('drive-away');
    electricianVan.classList.add('drive-in');
    SFX.vanEngine();

    await wait(CONFIG.timings.enRouteDuration * 0.7, signal);
    SFX.vanStop();

    // Bob steps out of the van holding ladder
    await wait(CONFIG.timings.enRouteDuration * 0.3, signal);
    actorBob.classList.add('visible');

    // ------------------------------------------------------------------------
    // 5. ARRIVED / CLIMBING (8 - 10s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.CLIMBING;
    updateHUDStatus('🪜 Bob Setting Ladder', 'repairing');
    foldingLadder.classList.add('placed');
    SFX.ladderClank();

    await wait(CONFIG.timings.climbingDuration * 0.4, signal);
    updateHUDStatus('🪜 Bob Climbing…', 'repairing');
    actorBob.classList.add('on-ladder');
    SFX.ladderClank();

    await wait(CONFIG.timings.climbingDuration * 0.6, signal);

    // ------------------------------------------------------------------------
    // 6. REPLACING (10 - 12.5s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.REPLACING;
    updateHUDStatus('🔧 Replacing Lightbulb…', 'repairing');

    // Unscrew broken base with squeak
    SFX.screwSqueak();
    crackStage1.setAttribute('opacity', '0');
    crackStage2.setAttribute('opacity', '0');

    await wait(CONFIG.timings.replacingDuration * 0.4, signal);
    // Screw in new bulb with golden sparkle
    SFX.screwSqueak();
    SFX.sparkle();
    bulbGlass.setAttribute('fill', '#fffae6');
    bulbGlass.setAttribute('opacity', '0.7');

    await wait(CONFIG.timings.replacingDuration * 0.6, signal);

    // ------------------------------------------------------------------------
    // 7. TESTING (12.5 - 14s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.TESTING;
    updateHUDStatus('✨ Testing Light…', 'repairing');

    // Bob flips the switch -> bulb flickers 2-3 times
    SFX.switchClick();
    setBulbVisualState(true, 0);
    await wait(120, signal);
    setBulbVisualState(false, 0);
    await wait(140, signal);
    setBulbVisualState(true, 0);
    await wait(100, signal);
    setBulbVisualState(false, 0);
    await wait(120, signal);

    // Steady light on
    setBulbVisualState(true, 0);
    SFX.lightHum();
    updateHUDStatus('💡 All Good!', 'lit');

    // Funny dialogue variations after every 3rd repair!
    STATE.repairsCompleted++;
    STATE.invoiceTotal += CONFIG.repairCost;
    statRepairsEl.textContent = STATE.repairsCompleted;
    statInvoiceEl.textContent = CONFIG.currency + STATE.invoiceTotal;

    if (STATE.repairsCompleted % 3 === 0) {
      showSpeechBubble(bubbleBob, 'Third time this week, Arthur! Added a cage!', CONFIG.timings.testingDuration);
      protectiveCage.setAttribute('opacity', '1');
    } else {
      showSpeechBubble(bubbleArthur, "You're a lifesaver, Bob!", CONFIG.timings.testingDuration * 0.5);
      setTimeout(() => {
        showSpeechBubble(bubbleBob, 'Anytime. Try not to break it!', CONFIG.timings.testingDuration * 0.5);
      }, (CONFIG.timings.testingDuration * 0.5) / STATE.speedMultiplier);
    }

    await wait(CONFIG.timings.testingDuration, signal);

    // ------------------------------------------------------------------------
    // 8. PACKING_UP / LEAVING (14 - 17s)
    // ------------------------------------------------------------------------
    STATE.current = STATES.PACKING_UP;
    updateHUDStatus('🚐 Bob Packing Up…', 'lit');
    hideSpeechBubbles();

    // Bob climbs down & folds ladder
    actorBob.classList.remove('on-ladder');
    SFX.ladderClank();
    await wait(CONFIG.timings.packingDuration * 0.25, signal);
    foldingLadder.classList.remove('placed');

    // Bob gets into van and drives away
    actorBob.classList.remove('visible');
    electricianVan.classList.add('drive-away');
    SFX.vanEngine();

    // Arthur goes back inside; door closes
    await wait(CONFIG.timings.packingDuration * 0.45, signal);
    actorArthur.classList.add('inside');
    doorSpill.classList.remove('open');
    svgDoorLeaf.removeAttribute('transform');

    await wait(CONFIG.timings.packingDuration * 0.3, signal);

    // ------------------------------------------------------------------------
    // 9. RETURN TO LIT IDLE
    // ------------------------------------------------------------------------
    STATE.current = STATES.LIT;
    STATE.bulbHealth = 3;
    STATE.isRepairing = false;
    btnSkipEl.disabled = true;
    stageEl.classList.remove('repairing');
    toolsPickerEl.classList.remove('blocked');
    document.querySelectorAll('.tool-opt').forEach(btn => btn.disabled = false);

    // If in Story Mode, present the completion card
    if (STATE.mode === 'story') {
      endCard.classList.add('visible');
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      console.log('Repair loop aborted cleanly.');
    } else {
      console.error(err);
    }
  }
}

/* ==========================================================================
   8. SCRIPTED STORY INTRO (STORY MODE)
   ========================================================================== */
async function startScriptedStory() {
  // Reset all state cleanly
  if (STATE.timelineAbortCtrl) STATE.timelineAbortCtrl.abort();
  STATE.timelineAbortCtrl = new AbortController();
  const signal = STATE.timelineAbortCtrl.signal;

  STATE.mode = 'story';
  STATE.isRepairing = false;
  STATE.speedMultiplier = 1;
  modeTextEl.textContent = '🎮 Free Play';
  endCard.classList.remove('visible');
  hideSpeechBubbles();
  phoneOverlay.classList.remove('calling');
  electricianVan.className = '';
  foldingLadder.className = '';
  actorBob.className = '';
  actorArthur.classList.add('inside');
  doorSpill.classList.remove('open');
  svgDoorLeaf.removeAttribute('transform');
  btnSkipEl.disabled = true;

  // Porch starts dark
  setBulbVisualState(false, 0);
  updateHUDStatus('🌙 Dark Porch', 'broken');

  try {
    await wait(900, signal);

    // Arthur emerges to check the lamp
    doorSpill.classList.add('open');
    svgDoorLeaf.setAttribute('transform', 'scale(0.2, 1)');
    actorArthur.classList.remove('inside');
    updateHUDStatus('🚶 Arthur Checking Lamp', 'broken');

    await wait(1200, signal);
    showSpeechBubble(bubbleArthur, "Why won't this light turn on?", 2200);

    await wait(1800, signal);

    // A stray pebble flies in and shatters the bulb!
    launchScriptedPebble();

  } catch (err) {
    if (err.name !== 'AbortError') console.error(err);
  }
}

/* ==========================================================================
   9. CANVAS PHYSICS: THROWABLES, TRAJECTORY, PARTICLES
   ========================================================================== */
let projectiles = [];
let particles = [];
let aimDrag = null;

class Projectile {
  constructor(x, y, vx, vy, toolType) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.toolType = toolType;
    this.radius = toolType === 'pebble' ? 7 : (toolType === 'wrench' ? 14 : 16);
    this.rot = 0;
    this.vrot = (Math.random() - 0.5) * 16;
    this.hit = false;
    this.dead = false;
  }

  update(dt) {
    this.vy += CONFIG.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rot += this.vrot * dt;

    // Check collision with hanging lightbulb: target circle around (360, 298)
    if (!this.hit && !STATE.isRepairing) {
      const bulbDist = Math.hypot(this.x - 360, this.y - 298);
      if (bulbDist < this.radius + 18) {
        this.hit = true;
        this.vx *= -0.3;
        this.vy *= -0.3;
        onBulbHit(this.toolType);
      }
    }

    // Floor collision
    if (this.y > 510) {
      this.y = 510;
      this.vy *= -0.3;
      this.vx *= 0.6;
      if (Math.abs(this.vy) < 50) this.dead = true;
    }

    // Out of bounds
    if (this.x < -60 || this.x > 1060) this.dead = true;
  }

  draw(c) {
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.rot);

    if (this.toolType === 'wrench') {
      c.fillStyle = '#94a3b8';
      c.strokeStyle = '#334155';
      c.lineWidth = 2;
      c.fillRect(-16, -4, 32, 8);
      c.beginPath();
      c.arc(-16, 0, 7, 0.7, 5.6);
      c.stroke();
    } else if (this.toolType === 'hammer') {
      c.fillStyle = '#78350f';
      c.fillRect(-3, -14, 6, 28);
      c.fillStyle = '#64748b';
      c.fillRect(-12, -18, 24, 9);
    } else {
      // Pebble
      c.fillStyle = '#cbd5e1';
      c.beginPath();
      c.arc(0, 0, this.radius, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }
}

class GlassShard {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 320;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - 120;
    this.rot = Math.random() * 6;
    this.vrot = (Math.random() - 0.5) * 22;
    this.size = 2.5 + Math.random() * 5;
    this.life = 0;
    this.maxLife = 2.2 + Math.random() * 1.5;
  }

  update(dt) {
    this.life += dt;
    this.vy += CONFIG.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rot += this.vrot * dt;

    if (this.y > 515) {
      this.y = 515;
      this.vy *= -0.22;
      this.vx *= 0.45;
    }
  }

  draw(c) {
    const alpha = Math.max(0, 1 - this.life / this.maxLife);
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.rot);
    c.globalAlpha = alpha;
    c.fillStyle = 'rgba(255, 250, 230, 0.85)';
    c.beginPath();
    c.moveTo(0, -this.size);
    c.lineTo(this.size * 0.8, this.size * 0.6);
    c.lineTo(-this.size * 0.6, this.size * 0.4);
    c.closePath();
    c.fill();
    c.restore();
  }
}

function spawnGlassShards(x, y) {
  for (let i = 0; i < 40; i++) {
    particles.push(new GlassShard(x, y));
  }
}

function onBulbHit(toolType) {
  // Transfer momentum to the physical hanging lamp
  STATE.lampVel += (Math.random() > 0.5 ? 1 : -1) * 3.5;

  const damage = toolType === 'hammer' ? 3 : (toolType === 'wrench' ? 1.5 : 1);
  STATE.bulbHealth = Math.max(0, STATE.bulbHealth - damage);

  if (STATE.bulbHealth <= 0) {
    runRepairLoop();
  } else {
    // Crack stage visual update
    SFX.clink();
    const crackLevel = STATE.bulbHealth <= 1.5 ? 2 : 1;
    setBulbVisualState(true, crackLevel);
    updateHUDStatus(`💥 Bulb Cracked (Health ${Math.ceil(STATE.bulbHealth)}/3)`, 'repairing');
  }
}

function launchScriptedPebble() {
  projectiles.push(new Projectile(80, 480, 360, -520, 'pebble'));
}

/* ==========================================================================
   10. USER INPUT & FREE PLAY THROWING
   ========================================================================== */
function getCanvasCoordinates(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (STATE.isRepairing) return;

  const pt = getCanvasCoordinates(e);
  aimDrag = { startX: pt.x, startY: pt.y, curX: pt.x, curY: pt.y };
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!aimDrag) return;
  const pt = getCanvasCoordinates(e);
  aimDrag.curX = pt.x;
  aimDrag.curY = pt.y;
});

function finishAimThrow(e) {
  if (!aimDrag) return;
  const dx = aimDrag.startX - aimDrag.curX;
  const dy = aimDrag.startY - aimDrag.curY;
  const dist = Math.hypot(dx, dy);

  // If dragged sufficiently, slingshot launch
  if (dist > 18) {
    const power = Math.min(dist * 7.5, 950);
    const angle = Math.atan2(dy, dx);
    const vx = Math.cos(angle) * power;
    const vy = Math.sin(angle) * power;

    projectiles.push(new Projectile(aimDrag.startX, aimDrag.startY, vx, vy, STATE.selectedTool));
    STATE.shots++;
    statShotsEl.textContent = STATE.shots;
    SFX.clink();
  } else {
    // Quick click / tap throws directly towards the bulb!
    const targetX = 360, targetY = 298;
    const tx = targetX - aimDrag.startX;
    const ty = targetY - aimDrag.startY;
    const tDist = Math.hypot(tx, ty);
    const speed = 780;
    const vx = (tx / tDist) * speed;
    const vy = (ty / tDist) * speed - 160;

    projectiles.push(new Projectile(aimDrag.startX, aimDrag.startY, vx, vy, STATE.selectedTool));
    STATE.shots++;
    statShotsEl.textContent = STATE.shots;
    SFX.clink();
  }
  aimDrag = null;
}

canvas.addEventListener('pointerup', finishAimThrow);
canvas.addEventListener('pointercancel', finishAimThrow);

// Tool buttons selection
document.querySelectorAll('.tool-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    initAudio();
    if (STATE.isRepairing) return;
    document.querySelectorAll('.tool-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    STATE.selectedTool = btn.dataset.tool;
  });
});

// HUD Control Buttons
btnSoundEl.addEventListener('click', () => {
  initAudio();
  STATE.soundEnabled = !STATE.soundEnabled;
  soundTextEl.textContent = STATE.soundEnabled ? '🔊 Sound: On' : '🔇 Sound: Off';
});

btnReplayEl.addEventListener('click', () => {
  initAudio();
  startScriptedStory();
});

btnModeEl.addEventListener('click', () => {
  initAudio();
  if (STATE.mode === 'story') {
    STATE.mode = 'free';
    modeTextEl.textContent = '📖 Story Mode';
    endCard.classList.remove('visible');
    setBulbVisualState(true, 0);
    updateHUDStatus('🎮 Free Play — Click or Drag to Throw!', 'lit');
  } else {
    startScriptedStory();
  }
});

btnEndFreeplay.addEventListener('click', () => {
  initAudio();
  STATE.mode = 'free';
  modeTextEl.textContent = '📖 Story Mode';
  endCard.classList.remove('visible');
  updateHUDStatus('🎮 Free Play — Click or Drag to Throw!', 'lit');
});

// Fast-forward Skip Repair Button
btnSkipEl.addEventListener('click', () => {
  if (STATE.isRepairing) {
    STATE.speedMultiplier = CONFIG.skipMultiplier;
    btnSkipEl.disabled = true;
    updateHUDStatus('⏩ Fast Forwarding Repair…', 'repairing');
  }
});

/* ==========================================================================
   11. MAIN ANIMATION & PHYSICS TICK (60FPS RAF)
   ========================================================================== */
let lastFrameTime = performance.now();

function gameLoop(time) {
  const dt = Math.min((time - lastFrameTime) / 1000, 0.04);
  lastFrameTime = time;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Update & Render Hanging Lamp Pendulum Physics
  STATE.lampVel += (-8.5 * Math.sin(STATE.lampAngle) - 0.25 * STATE.lampVel) * dt;
  STATE.lampAngle += STATE.lampVel * dt;
  lampHead.setAttribute('transform', `translate(0, 60) rotate(${STATE.lampAngle * (180 / Math.PI)})`);

  // Update & Draw Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.update(dt);
    p.draw(ctx);
    if (p.dead) projectiles.splice(i, 1);
  }

  // Update & Draw Particles (Glass Shards)
  for (let i = particles.length - 1; i >= 0; i--) {
    const s = particles[i];
    s.update(dt);
    s.draw(ctx);
    if (s.life >= s.maxLife) particles.splice(i, 1);
  }

  // Draw Aim Trajectory Dots when Dragging
  if (aimDrag && !STATE.isRepairing) {
    const dx = aimDrag.startX - aimDrag.curX;
    const dy = aimDrag.startY - aimDrag.curY;
    const dist = Math.hypot(dx, dy);

    if (dist > 18) {
      const power = Math.min(dist * 7.5, 950);
      const angle = Math.atan2(dy, dx);
      let simX = aimDrag.startX;
      let simY = aimDrag.startY;
      let simVx = Math.cos(angle) * power;
      let simVy = Math.sin(angle) * power;

      ctx.fillStyle = 'rgba(255, 200, 100, 0.7)';
      for (let i = 0; i < 24; i++) {
        for (let s = 0; s < 3; s++) {
          simVy += CONFIG.gravity * 0.012;
          simX += simVx * 0.012;
          simY += simVy * 0.012;
        }
        if (simY > 510) break;
        ctx.beginPath();
        ctx.arc(simX, simY, 2.8 * (1 - i / 24), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  requestAnimationFrame(gameLoop);
}

// Kickoff
startScriptedStory();
requestAnimationFrame(gameLoop);

})();
