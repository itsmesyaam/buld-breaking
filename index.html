<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050607">
<title>Leave the Lamp Alone — The Electrician's Fix</title>
<style>
:root{--ink:#ece6d9;--dim:#847e70;--warm:#ffc976;--accent:#ff9933;--card:rgba(18,20,24,0.78)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#040507;overflow:hidden;color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:10;pointer-events:none}

/* Top bar */
.top{top:24px;left:28px;max-width:520px}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent);background:rgba(255,153,51,.12);
  border:1px solid rgba(255,153,51,.25);padding:5px 10px;border-radius:999px;margin-bottom:14px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
h1{font-weight:700;font-size:clamp(26px,4vw,44px);line-height:1.06;letter-spacing:-.03em}
h1 em{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;color:var(--warm);
  text-shadow:0 0 28px rgba(255,185,90,.6);transition:color .35s,text-shadow .35s}
body.dark h1 em{color:#696358;text-shadow:none}
.story-subtitle{margin-top:10px;font-size:13.5px;line-height:1.55;color:var(--dim);max-width:440px}

/* Controls header */
.controls-top{top:22px;right:26px;display:flex;gap:10px;pointer-events:auto;z-index:20}
.btn{cursor:pointer;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12);color:var(--ink);font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  padding:9px 15px;border-radius:999px;transition:all .2s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);color:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:rgba(255,170,51,.16);border-color:rgba(255,170,51,.38);color:var(--warm)}
.btn-primary:hover{background:rgba(255,170,51,.28);border-color:rgba(255,170,51,.6)}

/* Bottom bar & Stats */
.stats{left:28px;bottom:24px;font:12px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
  background:var(--card);padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(8px);pointer-events:auto}
.stats b{color:var(--ink);font-weight:600}
#state{color:var(--warm);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
body.dark #state{color:#8a857a}

/* Story dialogue banner / prompt */
.story-banner{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:15;
  background:rgba(12,14,18,0.88);border:1px solid rgba(255,200,120,.25);backdrop-filter:blur(12px);
  padding:12px 24px;border-radius:999px;display:flex;align-items:center;gap:14px;
  font:500 13.5px ui-sans-serif,system-ui,sans-serif;box-shadow:0 12px 36px rgba(0,0,0,.6);
  pointer-events:auto;transition:all .3s ease;opacity:0;transform:translate(-50%,20px)}
.story-banner.show{opacity:1;transform:translate(-50%,0)}
.story-banner .speaker{font-weight:700;color:var(--accent);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.story-banner .text{color:var(--ink)}

/* Tool selector for sandbox mode */
.tool-select{position:fixed;bottom:24px;right:28px;display:flex;gap:8px;z-index:15;pointer-events:auto;
  background:var(--card);border:1px solid rgba(255,255,255,.08);padding:6px;border-radius:999px;backdrop-filter:blur(8px)}
.tool-btn{background:transparent;border:none;color:var(--dim);cursor:pointer;padding:7px 13px;border-radius:999px;
  font:600 11px ui-monospace,monospace;transition:all .2s;text-transform:uppercase;letter-spacing:.06em}
.tool-btn:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.tool-btn.active{background:rgba(255,170,51,.2);color:var(--warm)}

@media (max-width:850px){
  .top{top:16px;left:18px;right:18px;max-width:none}
  .story-subtitle{display:none}
  .controls-top{top:14px;right:16px}
  .stats{left:16px;bottom:16px;font-size:11px;padding:8px 12px}
  .tool-select{right:16px;bottom:16px}
  .story-banner{bottom:70px;max-width:90%;font-size:12px;padding:9px 16px}
}
</style>
</head>
<body class="dark">
<canvas id="c" aria-label="Interactive animated story: The Electrician's Fix"></canvas>

<!-- Top info -->
<div class="ui top">
  <div class="badge"><span class="dot"></span> <span id="mode-label">Story Animation</span></div>
  <h1>Leave the lamp <em>alone</em>.</h1>
  <p class="story-subtitle" id="story-desc">
    Arthur walks out to a dark porch. Frustrated, he calls his neighbor Bob the electrician. With a swift throw of his wrench—BAM! Percussive maintenance saves the day.
  </p>
</div>

<!-- Controls in top right -->
<div class="controls-top">
  <button id="btn-replay" class="btn btn-primary" type="button" title="Replay Story Animation">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/></svg>
    <span>Replay Story</span>
  </button>
  <button id="btn-mode" class="btn" type="button" title="Toggle Interactive Sandbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <span id="mode-btn-text">Free Play</span>
  </button>
  <button id="snd" class="btn" type="button" title="Toggle Synthesized Sound">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <span id="snd-text">Sound: On</span>
  </button>
</div>

<!-- Bottom Status -->
<div class="ui stats">
  <div>Lamp · <b id="state">OFF</b></div>
  <div>Shots <b id="shots">0</b> · Bulbs Broken <b id="bulbs">0</b></div>
</div>

<!-- Narrative speech banner -->
<div class="story-banner" id="story-banner">
  <span class="speaker" id="banner-speaker">Arthur</span>
  <span class="text" id="banner-text">Why won't this light turn on?</span>
</div>

<!-- Interactive tool picker -->
<div class="tool-select" id="tool-select">
  <button class="tool-btn active" data-tool="wrench">🔧 Wrench</button>
  <button class="tool-btn" data-tool="hammer">🔨 Hammer</button>
  <button class="tool-btn" data-tool="pebble">🪨 Pebble</button>
</div>

<script>
(() => {
const cv = document.getElementById('c'), x = cv.getContext('2d');
const G = 1450, POW = 11.2, MAXPULL = 130;

/* ---------- Global State ---------- */
let W, H, DPR, floorY, L;
let ax, ay = 0; // Lamp anchor point
let swX, swY;   // Wall switch position
let sX;         // Slingshot X
let rest;       // Slingshot rest position
let now = 0, dt = 0, lastTime = performance.now();

// Simulation and Scene State
const S = {
  on: false,
  bulb: true,
  bulbT: 1,
  glow: 0,
  flick: 0,
  pop: 0,
  th: 0,
  om: 0,
  shots: 0,
  broken: 0,
  sound: true,
  currentTool: 'wrench'
};

let pebbles = [], shards = [], dust = [], sparks = [];
let drag = false, grab = null, replaceAt = 0;
const ammo = { x: 0, y: 0, ready: true, a: 1, at: 0 };

/* ---------- Story Progression State Machine ---------- */
const STORY_MODES = { STORY: 'story', FREE: 'free' };
let currentMode = STORY_MODES.STORY;

const STORY = {
  state: 'INIT', // INIT, DOOR_OPEN, WALK_OUT, TRY_SWITCH, CALL_BOB, BOB_APPEARS, BOB_WINDUP, BOB_THROW, FLYING, IMPACT, TURN_ON, CELEBRATE, FINISHED
  timer: 0,
  speed: 1,
  toolFly: null, // Flying tool during animation
  arthur: { x: 0, targetX: 0, arm: 0, head: 0, doorOpen: 0, visible: false, emotion: 'normal' },
  bob: { x: 0, targetX: 0, arm: 0, visible: false, doorOpen: 0, emotion: 'normal' }
};

/* ---------- Resize & Layout ---------- */
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  x.setTransform(DPR, 0, 0, DPR, 0, 0);

  const m = W < 800;
  floorY = H - (m ? 92 : 82);
  ax = W * (m ? 0.44 : 0.43);
  ay = H * 0.12;
  L = Math.max(160, Math.min(H * 0.35, 300));
  swX = W * (m ? 0.28 : 0.29);
  swY = floorY - 145;
  sX = W * 0.18;
  rest = { x: sX, y: floorY - 110 };

  if (!drag){ ammo.x = rest.x; ammo.y = rest.y; }

  // Adjust story actors layout
  STORY.door1X = W * (m ? 0.14 : 0.16);
  STORY.door2X = W * (m ? 0.88 : 0.85);
  STORY.arthurStandX = W * (m ? 0.35 : 0.36);
  STORY.bobStandX = W * (m ? 0.77 : 0.76);

  if (STORY.state === 'INIT'){
    STORY.arthur.x = STORY.door1X;
    STORY.bob.x = STORY.door2X;
  }

  dust = Array.from({length: m ? 30 : 60}, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
    s: 0.6 + Math.random() * 1.5, ph: Math.random() * 6
  }));
}
addEventListener('resize', resize);

/* ---------- Audio Engine (Procedural Synthesis) ---------- */
let AC = null, master, nbuf;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch(e){ AC = null; }
}
const ok = () => AC && S.sound;

function tone(type, f1, f2, dur, vol, delay=0){
  if (!ok() || vol <= 0.0001) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1, f1), t);
  if (f2 && f2 > 0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(Math.max(0.0001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}

function noise(dur, vol, ftype, freq, delay=0){
  if (!ok() || vol <= 0.0001) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(Math.max(0.0001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.03);
}

const sfx = {
  click(){
    tone('square', 2400, 320, 0.035, 0.09);
    noise(0.03, 0.15, 'highpass', 3000);
    tone('square', 1600, 260, 0.03, 0.05, 0.045);
  },
  doorCreak(){
    tone('sawtooth', 120, 220, 0.45, 0.08);
    noise(0.4, 0.07, 'bandpass', 600);
  },
  footstep(){
    noise(0.06, 0.11, 'lowpass', 420);
    tone('triangle', 95, 40, 0.08, 0.07);
  },
  whoosh(){
    noise(0.35, 0.22, 'bandpass', 850);
  },
  clang(v = 1){
    [480, 1140, 1920, 2750].forEach((f, i) => {
      tone('sine', f * (1 + (Math.random() - 0.5) * 0.02), 0, 1.4 - i * 0.25, Math.max(0.001, 0.18 * v / (i * 0.7 + 1)));
    });
    noise(0.06, Math.max(0.001, 0.25 * v), 'bandpass', 2400);
  },
  spark(){
    for (let i = 0; i < 5; i++){
      noise(0.04, 0.16, 'highpass', 4000 + Math.random() * 3000, i * 0.03);
      tone('sawtooth', 800 + Math.random() * 800, 200, 0.03, 0.08, i * 0.03);
    }
  },
  hum(){
    tone('sine', 60, 60, 2.5, 0.14);
    tone('sine', 120, 120, 2.0, 0.08);
    tone('triangle', 180, 180, 1.2, 0.04);
  },
  cheer(){
    // Gentle melodic celebration arpeggio
    const chord = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    chord.forEach((freq, idx) => {
      tone('sine', freq, 0, 0.5, 0.12, idx * 0.11);
    });
  },
  shatter(){
    noise(0.5, 0.45, 'highpass', 1800);
    noise(0.12, 0.3, 'lowpass', 600);
    for (let i = 0; i < 9; i++) tone('sine', 3000 + Math.random() * 4500, 0, 0.08 + Math.random() * 0.1, 0.05, Math.random() * 0.45);
  },
  twang(){
    tone('triangle', 210, 80, 0.22, 0.18);
    noise(0.06, 0.12, 'bandpass', 900);
  },
  thud(v = 1){
    noise(0.09, Math.max(0.001, 0.25 * v), 'lowpass', 380);
  },
  tink(v = 1){
    tone('sine', 4000 + Math.random() * 3000, 0, 0.06, Math.max(0.001, 0.03 * v));
  }
};

/* ---------- Math & Coordinate Helpers ---------- */
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const mix = (a, b, t) => {
  const A = hex(a), B = hex(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
};
function rr(px, py, w, h, r){
  x.beginPath();
  x.moveTo(px+r, py); x.arcTo(px+w, py, px+w, py+h, r);
  x.arcTo(px+w, py+h, px, py+h, r); x.arcTo(px, py+h, px, py, r);
  x.arcTo(px, py, px+w, py, r); x.closePath();
}
const end = () => ({ x: ax + L * Math.sin(S.th), y: ay + L * Math.cos(S.th) });
function toLocal(px, py){
  const e = end(), dx = px - e.x, dy = py - e.y, c = Math.cos(S.th), s = Math.sin(S.th);
  return { x: dx*c - dy*s, y: dx*s + dy*c };
}
function toWorld(lx, ly){
  const e = end(), c = Math.cos(S.th), s = Math.sin(S.th);
  return { x: e.x + lx*c + ly*s, y: e.y - lx*s + ly*c };
}
function inShade(p, r){
  if (p.y < 2 - r || p.y > 66 + r) return false;
  const hw = 22 + Math.max(0, Math.min(60, p.y - 6)) / 60 * 40;
  return Math.abs(p.x) < hw + r;
}
const inBulb = (p, r) => S.bulb && S.bulbT > 0.6 && p.y > 62 && Math.hypot(p.x, p.y - 74) < 16 + r;
const onSwitch = (px, py, pad = 0) => Math.abs(px - swX) < 24 + pad && Math.abs(py - swY) < 38 + pad;

/* ---------- Story Dialogue & Banner ---------- */
const bannerEl = document.getElementById('story-banner');
const speakerEl = document.getElementById('banner-speaker');
const textEl = document.getElementById('banner-text');

function showDialogue(speaker, text, duration = 3000){
  speakerEl.textContent = speaker;
  textEl.textContent = text;
  bannerEl.classList.add('show');
  if (duration > 0){
    clearTimeout(bannerEl._timer);
    bannerEl._timer = setTimeout(() => hideDialogue(), duration);
  }
}
function hideDialogue(){
  bannerEl.classList.remove('show');
}

/* ---------- Start / Restart Story Animation ---------- */
function startStory(){
  currentMode = STORY_MODES.STORY;
  document.getElementById('mode-label').textContent = 'Story Animation';
  document.getElementById('mode-btn-text').textContent = 'Free Play';
  document.getElementById('tool-select').style.display = 'none';

  // Reset lamp & scene state
  S.on = false;
  S.th = 0;
  S.om = 0;
  S.glow = 0;
  S.flick = 0;
  S.pop = 0;
  pebbles = [];
  sparks = [];

  // Story Actor Initial Positions
  STORY.state = 'DOOR_OPEN';
  STORY.timer = 0;
  STORY.toolFly = null;

  STORY.arthur.x = STORY.door1X;
  STORY.arthur.doorOpen = 0;
  STORY.arthur.visible = true;
  STORY.arthur.arm = 0;
  STORY.arthur.emotion = 'normal';

  STORY.bob.x = STORY.door2X;
  STORY.bob.doorOpen = 0;
  STORY.bob.visible = false;
  STORY.bob.arm = 0;
  STORY.bob.emotion = 'normal';

  ui();
  sfx.doorCreak();
  showDialogue('Arthur', '*(stepping outside into the dark)*', 2200);
}

function switchToFreePlay(){
  currentMode = STORY_MODES.FREE;
  document.getElementById('mode-label').textContent = 'Sandbox / Free Play';
  document.getElementById('mode-btn-text').textContent = 'Play Story';
  document.getElementById('tool-select').style.display = 'flex';
  hideDialogue();

  // Make characters stand by relaxed
  STORY.arthur.visible = true;
  STORY.arthur.x = STORY.arthurStandX;
  STORY.arthur.arm = 0;
  STORY.bob.visible = true;
  STORY.bob.x = STORY.bobStandX;
  STORY.bob.arm = 0;
}

/* ---------- UI & Stats ---------- */
const $ = id => document.getElementById(id);
function ui(){
  $('state').textContent = S.bulb ? (S.on ? 'ON' : 'OFF') : 'BROKEN';
  $('shots').textContent = S.shots;
  $('bulbs').textContent = S.broken;
  document.body.classList.toggle('dark', !(S.on && S.bulb));
}
$('snd').addEventListener('click', () => {
  initAudio();
  S.sound = !S.sound;
  $('snd-text').textContent = 'Sound: ' + (S.sound ? 'On' : 'Off');
});
$('btn-replay').addEventListener('click', () => {
  initAudio();
  startStory();
});
$('btn-mode').addEventListener('click', () => {
  initAudio();
  if (currentMode === STORY_MODES.STORY) {
    switchToFreePlay();
  } else {
    startStory();
  }
});

// Tool selector buttons
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.currentTool = btn.dataset.tool;
  });
});

/* ---------- Core Physics Actions ---------- */
function toggle(){
  S.on = !S.on;
  sfx.click();
  if (S.on && S.bulb) S.flick = 0.25;
  ui();
}

function hitShade(p){
  const c = Math.cos(S.th), s = Math.sin(S.th);
  const vt = p.vx * c - p.vy * s;
  const sp = Math.hypot(p.vx, p.vy);
  S.om += vt / L * 0.48;
  p.hit = true;
  p.vx = -p.vx * 0.25 + (Math.random() - 0.5) * 80;
  p.vy = p.vy < 0 ? -p.vy * 0.25 : -p.vy * 0.3;
  sfx.clang(Math.min(1, sp / 1200));
  if (sp > 600 && S.on && S.bulb) S.flick = 0.28;

  // Create sparks upon metal impact
  for (let i = 0; i < 12; i++){
    const ang = Math.random() * Math.PI * 2, v = 80 + Math.random() * 260;
    sparks.push({ x: p.x, y: p.y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life: 0, maxLife: 0.3 + Math.random() * 0.25 });
  }
}

function breakBulb(p){
  const b = toWorld(0, 74), c = Math.cos(S.th), s = Math.sin(S.th);
  S.om += (p.vx * c - p.vy * s) / L * 0.22;
  if (S.on) S.pop = 1;
  S.bulb = false; S.broken++; replaceAt = now + 2.5;
  p.hit = true; p.vx *= 0.5; p.vy *= 0.5;

  for (let i = 0; i < 32; i++){
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 420;
    shards.push({
      x: b.x + (Math.random() - 0.5) * 18,
      y: b.y + (Math.random() - 0.5) * 18,
      vx: Math.cos(a) * v + p.vx * 0.15,
      vy: Math.sin(a) * v - 160 + p.vy * 0.1,
      r: Math.random() * 6,
      vr: (Math.random() - 0.5) * 22,
      s: 2.2 + Math.random() * 5,
      life: 0,
      rest: false
    });
  }
  if (shards.length > 180) shards.splice(0, shards.length - 180);
  sfx.shatter();
  ui();
}

/* ---------- User Input Handling ---------- */
function pos(e){ return { x: e.clientX, y: e.clientY }; }

cv.addEventListener('pointerdown', e => {
  initAudio();
  const m = pos(e);

  if (onSwitch(m.x, m.y, 8)) { toggle(); return; }

  if (ammo.ready && Math.hypot(m.x - ammo.x, m.y - ammo.y) < 46) {
    drag = true;
    cv.setPointerCapture(e.pointerId);
    return;
  }

  const l = toLocal(m.x, m.y);
  if (inShade(l, 12) || Math.hypot(l.x, l.y - 74) < 28) {
    grab = { off: S.th - Math.atan2(m.x - ax, m.y - ay), t: performance.now() };
    cv.setPointerCapture(e.pointerId);
  }
});

cv.addEventListener('pointermove', e => {
  const m = pos(e);
  if (drag){
    let dx = m.x - rest.x, dy = m.y - rest.y;
    const d = Math.hypot(dx, dy);
    if (d > MAXPULL){ dx *= MAXPULL / d; dy *= MAXPULL / d; }
    ammo.x = rest.x + dx; ammo.y = rest.y + dy;
    return;
  }
  if (grab){
    const t = performance.now(), deltaT = Math.max(0.008, (t - grab.t) / 1000);
    let nt = Math.atan2(m.x - ax, m.y - ay) + grab.off;
    nt = Math.max(-1.3, Math.min(1.3, nt));
    S.om = Math.max(-9, Math.min(9, S.om * 0.5 + (nt - S.th) / deltaT * 0.5));
    S.th = nt;
    grab.t = t;
    return;
  }

  const l = toLocal(m.x, m.y);
  cv.style.cursor = onSwitch(m.x, m.y, 8) ? 'pointer'
    : (ammo.ready && Math.hypot(m.x - ammo.x, m.y - ammo.y) < 46) || inShade(l, 12) || Math.hypot(l.x, l.y - 74) < 28 ? 'grab' : 'default';
});

function release(){
  if (drag){
    drag = false;
    const vx = (rest.x - ammo.x) * POW, vy = (rest.y - ammo.y) * POW;
    if (Math.hypot(rest.x - ammo.x, rest.y - ammo.y) > 12){
      pebbles.push({
        x: ammo.x, y: ammo.y, vx, vy,
        r: S.currentTool === 'wrench' ? 12 : (S.currentTool === 'hammer' ? 14 : 7),
        tool: S.currentTool,
        rot: 0, vrot: 14 + Math.random() * 8,
        hit: false, life: 0, rest: false
      });
      if (pebbles.length > 25) pebbles.shift();
      S.shots++;
      ammo.ready = false;
      ammo.at = now + 0.45;
      sfx.twang();
      ui();
    }
    ammo.x = rest.x; ammo.y = rest.y;
  }
  grab = null;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

/* ---------- Story Update Loop ---------- */
function updateStory(dt){
  STORY.timer += dt * STORY.speed;

  switch (STORY.state){
    case 'DOOR_OPEN':
      STORY.arthur.doorOpen = Math.min(1, STORY.arthur.doorOpen + dt * 2.5);
      if (STORY.timer > 0.7){
        STORY.state = 'WALK_OUT';
        STORY.timer = 0;
      }
      break;

    case 'WALK_OUT':
      // Arthur steps onto the porch towards the switch
      const targetX = STORY.arthurStandX;
      if (STORY.arthur.x < targetX){
        STORY.arthur.x += dt * 85;
        if (Math.floor(STORY.timer * 7) % 2 === 0 && Math.random() < 0.15) sfx.footstep();
      }
      if (STORY.timer > 0.8 && STORY.arthur.doorOpen > 0){
        STORY.arthur.doorOpen = Math.max(0, STORY.arthur.doorOpen - dt * 2);
      }
      if (STORY.arthur.x >= targetX){
        STORY.arthur.x = targetX;
        STORY.state = 'TRY_SWITCH';
        STORY.timer = 0;
        showDialogue('Arthur', 'Huh? The porch light won’t turn on...', 2800);
      }
      break;

    case 'TRY_SWITCH':
      // Arthur flips the switch twice
      if (STORY.timer > 0.5 && STORY.timer < 0.6 && !S.on){
        sfx.click();
        STORY.arthur.arm = 1; // reach toward switch
      }
      if (STORY.timer > 1.1 && STORY.timer < 1.2){
        sfx.click(); // clicks again, nothing
        STORY.arthur.emotion = 'confused';
      }
      if (STORY.timer > 1.8){
        STORY.arthur.arm = 2; // head scratch
      }
      if (STORY.timer > 2.6){
        STORY.state = 'CALL_BOB';
        STORY.timer = 0;
        showDialogue('Arthur', 'Hey Bob! Can you help me out? The light’s dead again!', 3000);
        STORY.arthur.arm = 3; // hand cupped calling
      }
      break;

    case 'CALL_BOB':
      if (STORY.timer > 1.0){
        STORY.state = 'BOB_APPEARS';
        STORY.timer = 0;
        sfx.doorCreak();
        STORY.bob.visible = true;
      }
      break;

    case 'BOB_APPEARS':
      STORY.bob.doorOpen = Math.min(1, STORY.bob.doorOpen + dt * 2.8);
      if (STORY.bob.x > STORY.bobStandX){
        STORY.bob.x -= dt * 75;
      }
      if (STORY.timer > 0.8){
        showDialogue('Bob (Electrician)', 'Hold tight neighbor! I got just the right tool for this!', 2800);
      }
      if (STORY.timer > 2.2){
        STORY.state = 'BOB_WINDUP';
        STORY.timer = 0;
        showDialogue('Bob (Electrician)', 'Stand back! Percussive maintenance incoming!', 2000);
      }
      break;

    case 'BOB_WINDUP':
      // Bob winds up arm holding a wrench
      STORY.bob.arm = Math.min(1, STORY.bob.arm + dt * 2.2);
      if (STORY.timer > 1.1){
        STORY.state = 'BOB_THROW';
        STORY.timer = 0;
      }
      break;

    case 'BOB_THROW':
      // Bob flings the wrench!
      sfx.whoosh();
      STORY.bob.arm = -0.5; // follow-through

      // Compute precise arc so tool hits the lamp fixture
      const startX = STORY.bob.x - 12;
      const startY = floorY - 58;
      const targetLamp = end();
      const hitX = targetLamp.x + 8;
      const hitY = targetLamp.y + 24;

      const flightDuration = 0.82;
      const vx = (hitX - startX) / flightDuration;
      const vy = (hitY - startY - 0.5 * G * flightDuration * flightDuration) / flightDuration;

      STORY.toolFly = {
        x: startX, y: startY,
        vx, vy,
        rot: 0, vrot: -18,
        flightTime: flightDuration,
        t: 0
      };

      STORY.state = 'FLYING';
      STORY.timer = 0;
      break;

    case 'FLYING':
      if (STORY.toolFly){
        const tf = STORY.toolFly;
        tf.t += dt;
        tf.vy += G * dt;
        tf.x += tf.vx * dt;
        tf.y += tf.vy * dt;
        tf.rot += tf.vrot * dt;

        // Check if tool has reached target
        if (tf.t >= tf.flightTime || tf.x <= end().x + 12){
          STORY.state = 'IMPACT';
          STORY.timer = 0;
        }
      }
      break;

    case 'IMPACT':
      // Tool slams the lamp fixture / switch!
      sfx.clang(1.0);
      sfx.spark();

      // Strong momentum transferred to the lamp
      S.om += -6.5;

      // Create burst of electrical sparks
      const impX = end().x;
      const impY = end().y + 20;
      for (let i = 0; i < 28; i++){
        const ang = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 380;
        sparks.push({
          x: impX, y: impY,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          life: 0, maxLife: 0.4 + Math.random() * 0.3
        });
      }

      // Drop tool to the floor after impact
      if (STORY.toolFly){
        pebbles.push({
          x: impX, y: impY,
          vx: 120 + Math.random() * 60,
          vy: -80,
          r: 12,
          tool: 'wrench',
          rot: STORY.toolFly.rot,
          vrot: 10,
          hit: true, life: 0, rest: false
        });
        STORY.toolFly = null;
      }

      STORY.state = 'TURN_ON';
      STORY.timer = 0;
      break;

    case 'TURN_ON':
      // Light flickers wildly and surges ON!
      if (STORY.timer < 0.25){
        S.flick = 0.35;
      } else if (!S.on){
        S.on = true;
        S.flick = 0.4;
        sfx.hum();
        sfx.cheer();
        ui();
        showDialogue('Arthur', 'WHOA! It actually turned on!!', 3500);
        STORY.arthur.arm = 4; // cheering hands up
        STORY.bob.arm = 2;    // thumbs up / confident pose
      }

      if (STORY.timer > 1.2){
        STORY.state = 'CELEBRATE';
        STORY.timer = 0;
      }
      break;

    case 'CELEBRATE':
      if (STORY.timer > 2.0 && STORY.timer < 2.2){
        showDialogue('Bob (Electrician)', 'Works every time! Enjoy the light, neighbor!', 4000);
      }
      if (STORY.timer > 6.0){
        STORY.state = 'FINISHED';
        document.getElementById('tool-select').style.display = 'flex';
      }
      break;

    case 'FINISHED':
      break;
  }
}

/* ---------- Physics Simulation ---------- */
function update(dt){
  if (currentMode === STORY_MODES.STORY){
    updateStory(dt);
  }

  // Damped Pendulum Physics
  if (!grab){
    S.om += (-9.2 * Math.sin(S.th) - 0.28 * S.om) * dt;
    S.th += S.om * dt;
  } else {
    S.om *= 0.85;
  }

  // Bulb Replacement Logic
  if (!S.bulb && now > replaceAt){
    S.bulb = true;
    S.bulbT = 0;
    ui();
  }
  if (S.bulbT < 1){
    S.bulbT = Math.min(1, S.bulbT + dt * 2.2);
    if (S.bulbT === 1 && S.on) S.flick = 0.35;
  }

  // Lighting glow and flicker interpolation
  let targetGlow = S.on && S.bulb && S.bulbT > 0.95 ? 1 : 0;
  if (S.flick > 0){
    S.flick -= dt;
    targetGlow *= Math.random() < 0.5 ? 0.2 : 1;
  }
  S.glow += (targetGlow - S.glow) * Math.min(1, dt * (targetGlow ? 15 : 20));
  S.pop = Math.max(0, S.pop - dt * 4);

  // Slingshot reload
  if (!ammo.ready && now > ammo.at){ ammo.ready = true; ammo.a = 0; }
  ammo.a = Math.min(1, ammo.a + dt * 4);

  // Pebbles / Tools physics
  for (const p of pebbles){
    p.life += dt;
    if (p.rest) continue;
    p.vy += G * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += (p.vrot || 0) * dt;

    if (!p.hit){
      if (onSwitch(p.x, p.y, p.r)){
        p.hit = true;
        toggle();
        p.vx *= -0.35;
        p.vy *= 0.3;
      } else {
        const l = toLocal(p.x, p.y);
        if (inBulb(l, p.r)) breakBulb(p);
        else if (inShade(l, p.r)) hitShade(p);
      }
    }

    if (p.y > floorY - p.r){
      p.y = floorY - p.r;
      if (Math.abs(p.vy) > 120) sfx.thud(Math.min(1, Math.abs(p.vy) / 900));
      p.vy *= -0.28;
      p.vx *= 0.55;
      if (p.vrot) p.vrot *= 0.4;
      if (Math.abs(p.vy) < 60){ p.vy = 0; p.rest = true; }
    }
    if (p.x < p.r){ p.x = p.r; p.vx *= -0.5; }
    if (p.x > W - p.r){ p.x = W - p.r; p.vx *= -0.5; }
  }
  pebbles = pebbles.filter(p => p.life < 10);

  // Glass shards
  for (const s of shards){
    s.life += dt;
    if (s.rest) continue;
    s.vy += G * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.r += s.vr * dt;
    if (s.y > floorY - 1){
      s.y = floorY - 1;
      if (Math.abs(s.vy) > 150) sfx.tink(0.6);
      s.vy *= -0.25; s.vx *= 0.45; s.vr *= 0.4;
      if (Math.abs(s.vy) < 40) s.rest = true;
    }
  }
  shards = shards.filter(s => s.life < 7);

  // Electrical sparks
  for (const sp of sparks){
    sp.life += dt;
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.vy += 800 * dt;
  }
  sparks = sparks.filter(sp => sp.life < sp.maxLife);

  // Dust motes floating in beam
  for (const d of dust){
    d.x += (d.vx + Math.sin(now * 0.4 + d.ph) * 3) * dt;
    d.y += (d.vy + Math.cos(now * 0.3 + d.ph) * 2) * dt;
    if (d.x < 0) d.x += W;
    if (d.x > W) d.x -= W;
    if (d.y < 0) d.y += floorY;
    if (d.y > floorY) d.y -= floorY;
  }
}

/* ---------- Drawing Utilities ---------- */
function drawWrench(px, py, scale = 1, angle = 0, alpha = 1){
  x.save();
  x.translate(px, py);
  x.rotate(angle);
  x.scale(scale, scale);
  x.globalAlpha = alpha;

  // Metallic gradient
  const wg = x.createLinearGradient(-18, -4, 18, 4);
  wg.addColorStop(0, '#7d8692');
  wg.addColorStop(0.5, '#cfd6e0');
  wg.addColorStop(1, '#505660');
  x.fillStyle = wg;
  x.strokeStyle = '#2b2f36';
  x.lineWidth = 1;

  // Handle
  rr(-18, -3.5, 36, 7, 2);
  x.fill(); x.stroke();

  // Left open jaw
  x.beginPath();
  x.arc(-18, 0, 8, 0.7, 5.6);
  x.lineTo(-18, -4);
  x.lineTo(-24, 0);
  x.lineTo(-18, 4);
  x.closePath();
  x.fill(); x.stroke();

  // Right ring end
  x.beginPath();
  x.arc(18, 0, 7.5, 0, Math.PI * 2);
  x.fill(); x.stroke();
  x.fillStyle = '#060709';
  x.beginPath();
  x.arc(18, 0, 4.5, 0, Math.PI * 2);
  x.fill();

  x.restore();
}

function drawHammer(px, py, scale = 1, angle = 0, alpha = 1){
  x.save();
  x.translate(px, py);
  x.rotate(angle);
  x.scale(scale, scale);
  x.globalAlpha = alpha;

  // Handle
  x.fillStyle = '#9c663a';
  rr(-3, -16, 6, 32, 2);
  x.fill();

  // Head
  const hg = x.createLinearGradient(-14, -18, 14, -10);
  hg.addColorStop(0, '#5a626d'); hg.addColorStop(1, '#9ba6b5');
  x.fillStyle = hg;
  rr(-14, -20, 28, 9, 2);
  x.fill();

  x.restore();
}

function peb(px, py, r, a){
  x.globalAlpha = a;
  const g = x.createRadialGradient(px - r*0.35, py - r*0.4, 1, px, py, r);
  g.addColorStop(0, '#bbb5ab');
  g.addColorStop(1, '#34322f');
  x.fillStyle = g;
  x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  x.globalAlpha = 1;
}

  // Bob's Door
  x.fillStyle = '#050608';
  rr(d2X - doorW/2, doorY, doorW, doorH, 3); x.fill();
  const bobDoorOffset = (1 - STORY.bob.doorOpen) * doorW;
  x.fillStyle = '#221914';
  rr(d2X - doorW/2, doorY, bobDoorOffset, doorH, 2); x.fill();

  // Wooden fence between houses
  const fenceStartX = W * 0.58, fenceEndX = W * 0.72;
  x.fillStyle = '#100c08';
  for (let fx = fenceStartX; fx < fenceEndX; fx += 14){
    x.fillRect(fx, floorY - 56, 10, 56);
    x.beginPath();
    x.moveTo(fx, floorY - 56);
    x.lineTo(fx + 5, floorY - 65);
    x.lineTo(fx + 10, floorY - 56);
    x.fill();
  }
  x.fillRect(fenceStartX - 2, floorY - 44, fenceEndX - fenceStartX + 4, 6);
  x.fillRect(fenceStartX - 2, floorY - 20, fenceEndX - fenceStartX + 4, 6);

  // Ambient Room Warm Glow (When Light is ON)
  if (g > 0.01){
    const wg = x.createRadialGradient(e.x, e.y + 80, 10, e.x, e.y + 80, Math.max(W, H) * 0.85);
    wg.addColorStop(0, `rgba(92,68,38,${0.58 * g})`);
    wg.addColorStop(0.35, `rgba(38,29,18,${0.42 * g})`);
    wg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = wg;
    x.fillRect(0, 0, W, H);
  }

  // Wooden Floor Planks
  x.fillStyle = mix('#08090b', '#1a140d', g * 0.82);
  x.fillRect(0, floorY, W, H - floorY);
  x.fillStyle = `rgba(255,255,255,${0.04 + 0.08 * g})`;
  x.fillRect(0, floorY, W, 1.5);
  x.fillStyle = 'rgba(0,0,0,0.4)';
  x.fillRect(0, floorY - 10, W, 10);

  // Floor plank grooves
  x.strokeStyle = 'rgba(0,0,0,0.35)';
  x.lineWidth = 1;
  for (let px = 0; px < W; px += 45){
    x.beginPath(); x.moveTo(px, floorY); x.lineTo(px, H); x.stroke();
  }

  // Volumetric Light Cone and Dust
  if (g > 0.01){
    const c = Math.cos(S.th);
    if (c > 0.3){
      const t = (floorY - e.y) / c, fx = e.x + t * Math.sin(S.th), rw = t * 0.82;
      x.save();
      x.globalCompositeOperation = 'lighter';
      x.translate(fx, floorY + 4);
      x.scale(1, 0.14);
      const pg = x.createRadialGradient(0, 0, 0, 0, 0, rw);
      pg.addColorStop(0, `rgba(255,205,130,${0.45 * g})`);
      pg.addColorStop(1, 'rgba(255,190,110,0)');
      x.fillStyle = pg;
      x.beginPath(); x.arc(0, 0, rw, 0, 7); x.fill();
      x.restore();
    }

    // Light cone geometry
    x.save();
    x.beginPath(); x.rect(0, 0, W, floorY); x.clip();
    x.globalCompositeOperation = 'lighter';
    x.translate(e.x, e.y);
    x.rotate(-S.th);
    const far = H * 1.6, cg = x.createLinearGradient(0, 66, 0, far * 0.65);
    cg.addColorStop(0, `rgba(255,215,150,${0.32 * g})`);
    cg.addColorStop(0.35, `rgba(255,190,110,${0.11 * g})`);
    cg.addColorStop(1, 'rgba(255,180,100,0)');
    x.fillStyle = cg;
    x.beginPath();
    x.moveTo(-58, 64);
    x.lineTo(58, 64);
    x.lineTo(far * 0.62, far);
    x.lineTo(-far * 0.62, far);
    x.closePath();
    x.fill();
    x.restore();

    // Dust particles in beam
    x.save();
    x.globalCompositeOperation = 'lighter';
    for (const d of dust){
      const l = toLocal(d.x, d.y);
      if (l.y < 70) continue;
      const hw = 58 + (l.y - 64) * 0.62;
      if (Math.abs(l.x) > hw) continue;
      const a = g * (1 - Math.abs(l.x)/hw) * Math.max(0, 1 - l.y / (H * 0.9)) * (0.5 + 0.5 * Math.sin(now * 1.3 + d.ph));
      x.fillStyle = `rgba(255,230,190,${a * 0.75})`;
      x.beginPath(); x.arc(d.x, d.y, d.s, 0, 7); x.fill();
    }
    x.restore();

    // Bulb halo
    x.save();
    x.globalCompositeOperation = 'lighter';
    const hg = x.createRadialGradient(b.x, b.y, 0, b.x, b.y, 270);
    hg.addColorStop(0, `rgba(255,220,160,${0.45 * g})`);
    hg.addColorStop(0.25, `rgba(255,190,110,${0.14 * g})`);
    hg.addColorStop(1, 'rgba(255,180,100,0)');
    x.fillStyle = hg;
    x.fillRect(b.x - 270, b.y - 270, 540, 540);
    x.restore();
  }

  // Draw Animated Characters
  drawArthur(STORY.arthur.x, floorY);
  drawBob(STORY.bob.x, floorY);

  // Electrical Conduit & Cord
  x.strokeStyle = mix('#18191b', '#3a3128', g);
  x.lineWidth = 2.2;
  x.beginPath(); x.moveTo(ax, ay); x.lineTo(e.x, e.y); x.stroke();
  x.fillStyle = '#131416';
  rr(ax - 20, ay - 8, 40, 16, 5); x.fill();

  // Conduit line to wall switch
  x.strokeStyle = '#1b1d22';
  x.lineWidth = 3;
  x.beginPath();
  x.moveTo(ax, ay);
  x.lineTo(swX, ay);
  x.lineTo(swX, swY - 38);
  x.stroke();

  // Hanging Pendant Lamp Assembly (Local reference frame)
  x.save();
  x.translate(e.x, e.y);
  x.rotate(-S.th);

  // Fixture socket
  x.fillStyle = '#1b1d20';
  rr(-8, -3, 16, 12, 3); x.fill();

  // Outer Metal Shade
  const sg = x.createLinearGradient(-62, 0, 62, 0);
  sg.addColorStop(0, '#0c0d0f');
  sg.addColorStop(0.42, mix('#25282c', '#4a3f31', g));
  sg.addColorStop(0.6, mix('#1c1e21', '#352d23', g));
  sg.addColorStop(1, '#0a0b0c');
  x.fillStyle = sg;
  x.beginPath();
  x.moveTo(-22, 6);
  x.lineTo(22, 6);
  x.lineTo(62, 66);
  x.lineTo(-62, 66);
  x.closePath();
  x.fill();

  x.strokeStyle = `rgba(255,255,255,${0.05 + 0.08 * g})`;
  x.lineWidth = 1;
  x.beginPath(); x.moveTo(-22, 6); x.lineTo(22, 6); x.stroke();

  // Inner Reflective Rim
  const ig = x.createRadialGradient(0, 66, 0, 0, 66, 62);
  ig.addColorStop(0, mix('#101113', '#fff1d0', g));
  ig.addColorStop(1, mix('#08090a', '#b8782f', g));
  x.fillStyle = ig;
  x.beginPath(); x.ellipse(0, 66, 62, 7, 0, 0, Math.PI * 2); x.fill();

  // Glass Lightbulb
  x.save();
  x.beginPath();
  x.ellipse(0, 66, 61, 7, 0, 0, Math.PI * 2);
  x.rect(-40, 66, 80, 50);
  x.clip();

  if (S.bulb){
    const k = 1 - Math.pow(1 - S.bulbT, 3);
    x.translate(0, 60); x.scale(k, k); x.translate(0, -60);
    const og = x.createRadialGradient(-5, 68, 1, 0, 74, 16);
    og.addColorStop(0, '#5a5c60'); og.addColorStop(1, '#1d1e21');
    x.fillStyle = og;
    x.beginPath(); x.arc(0, 74, 16, 0, 7); x.fill();

    if (g > 0.01){
      x.globalAlpha = g;
      const lg = x.createRadialGradient(0, 74, 1, 0, 74, 16);
      lg.addColorStop(0, '#fffdf4');
      lg.addColorStop(0.55, '#ffe2a6');
      lg.addColorStop(1, '#ffb35c');
      x.fillStyle = lg;
      x.beginPath(); x.arc(0, 74, 16, 0, 7); x.fill();
      x.globalAlpha = 1;
    }
    x.fillStyle = `rgba(255,255,255,${0.22 - 0.15 * g})`;
    x.beginPath(); x.ellipse(-6, 70, 3, 5, -0.5, 0, 7); x.fill();
  } else {
    // Broken filament base
    x.fillStyle = '#2a2c30';
    x.strokeStyle = 'rgba(200,215,230,.35)';
    x.lineWidth = 1;
    x.beginPath();
    x.moveTo(-11, 60); x.lineTo(-10, 70); x.lineTo(-6, 66); x.lineTo(-3, 75);
    x.lineTo(1, 68); x.lineTo(5, 73); x.lineTo(9, 66); x.lineTo(11, 60);
    x.closePath(); x.fill(); x.stroke();
  }
  x.restore();
  x.restore();

  // Wall Switch
  x.save();
  x.shadowColor = 'rgba(0,0,0,.6)';
  x.shadowBlur = 12;
  x.shadowOffsetY = 4;
  x.fillStyle = mix('#111214', '#3b3328', g * 0.75);
  rr(swX - 23, swY - 38, 46, 76, 7); x.fill();
  x.restore();

  x.strokeStyle = `rgba(255,255,255,${0.06 + 0.06 * g})`;
  x.lineWidth = 1;
  rr(swX - 23, swY - 38, 46, 76, 7); x.stroke();

  x.fillStyle = '#060707';
  rr(swX - 9, swY - 20, 18, 40, 4); x.fill();

  const ly = S.on ? swY - 18 : swY + 2;
  const lvg = x.createLinearGradient(0, ly, 0, ly + 16);
  lvg.addColorStop(0, mix('#3a3c40', '#a89479', g));
  lvg.addColorStop(1, mix('#1c1d20', '#5c4d3a', g));
  x.fillStyle = lvg;
  rr(swX - 7, ly, 14, 16, 3); x.fill();

  x.font = '600 9px ui-monospace,Menlo,monospace';
  x.textAlign = 'center';
  x.fillStyle = `rgba(236,230,217,${S.on ? 0.55 : 0.2})`;
  x.fillText('ON', swX, swY - 48);
  x.fillStyle = `rgba(236,230,217,${S.on ? 0.2 : 0.55})`;
  x.fillText('OFF', swX, swY + 56);

  // Slingshot (Interactive Launcher)
  const wood = mix('#24190f', '#6a4829', 0.15 + g * 0.75), fy = floorY;
  x.fillStyle = 'rgba(0,0,0,.45)';
  x.beginPath(); x.ellipse(sX, fy + 2, 28, 5, 0, 0, 7); x.fill();

  x.lineCap = 'round';
  x.strokeStyle = wood;
  x.lineWidth = 11;
  x.beginPath(); x.moveTo(sX, fy); x.lineTo(sX, fy - 62); x.stroke();
  x.lineWidth = 9;
  x.beginPath();
  x.moveTo(sX, fy - 60); x.quadraticCurveTo(sX - 28, fy - 72, sX - 28, fy - 118);
  x.moveTo(sX, fy - 60); x.quadraticCurveTo(sX + 28, fy - 72, sX + 28, fy - 118);
  x.stroke();

  const tl = { x: sX - 28, y: fy - 116 }, tr = { x: sX + 28, y: fy - 116 };
  const pull = Math.hypot(ammo.x - rest.x, ammo.y - rest.y);
  const band = mix('#4a1d16', '#a33c2a', 0.2 + g * 0.7);
  const bw = 4 - pull / MAXPULL * 1.8;

  x.strokeStyle = band; x.lineWidth = bw;
  if (ammo.ready){
    x.beginPath(); x.moveTo(tr.x, tr.y); x.lineTo(ammo.x + 6, ammo.y); x.stroke();
    x.fillStyle = '#2a1a12';
    x.beginPath();
    x.ellipse(ammo.x, ammo.y, 12, 9, Math.atan2(ammo.y - rest.y, ammo.x - rest.x), 0, 7);
    x.fill();

    if (S.currentTool === 'wrench') drawWrench(ammo.x, ammo.y, 0.85, 0, ammo.a);
    else if (S.currentTool === 'hammer') drawHammer(ammo.x, ammo.y, 0.75, 0, ammo.a);
    else peb(ammo.x, ammo.y, 7, ammo.a);

    x.strokeStyle = band; x.lineWidth = bw;
    x.beginPath(); x.moveTo(tl.x, tl.y); x.lineTo(ammo.x - 6, ammo.y); x.stroke();
  } else {
    x.beginPath(); x.moveTo(tl.x, tl.y); x.quadraticCurveTo(sX, fy - 104, tr.x, tr.y); x.stroke();
  }
  x.lineCap = 'butt';

  // Draw Flying Tool during Story Animation
  if (STORY.toolFly){
    const tf = STORY.toolFly;
    drawWrench(tf.x, tf.y, 1.1, tf.rot);
  }

  // Draw Projectiles & Tools
  for (const p of pebbles){
    if (p.tool === 'wrench') drawWrench(p.x, p.y, 1.0, p.rot, Math.min(1, (10 - p.life) / 1.5));
    else if (p.tool === 'hammer') drawHammer(p.x, p.y, 0.85, p.rot, Math.min(1, (10 - p.life) / 1.5));
    else peb(p.x, p.y, p.r, Math.min(1, (10 - p.life) / 1.5));
  }

  // Draw Glass Shards
  for (const s of shards){
    const a = Math.min(1, (7 - s.life) / 1.2);
    x.save();
    x.translate(s.x, s.y);
    x.rotate(s.r);
    x.globalAlpha = a;
    x.fillStyle = `rgba(200,215,230,${0.3 + 0.3 * g})`;
    x.strokeStyle = `rgba(255,255,255,${0.25 + 0.45 * g})`;
    x.lineWidth = 0.7;
    x.beginPath();
    x.moveTo(0, -s.s);
    x.lineTo(s.s * 0.8, s.s * 0.6);
    x.lineTo(-s.s * 0.6, s.s * 0.4);
    x.closePath();
    x.fill(); x.stroke();
    x.restore();
  }

  // Draw Electrical Sparks
  for (const sp of sparks){
    const lifeRatio = 1 - sp.life / sp.maxLife;
    x.strokeStyle = `rgba(255,240,160,${lifeRatio})`;
    x.fillStyle = `rgba(255,180,60,${lifeRatio})`;
    x.lineWidth = 1.5;
    x.beginPath();
    x.moveTo(sp.x, sp.y);
    x.lineTo(sp.x - sp.vx * 0.03, sp.y - sp.vy * 0.03);
    x.stroke();
  }

  // Ambient Vignette & Darkness Layer
  x.fillStyle = `rgba(2,3,4,${0.55 * (1 - g)})`;
  x.fillRect(0, 0, W, H);

  if (S.pop > 0){
    x.fillStyle = `rgba(255,240,215,${S.pop * 0.48})`;
    x.fillRect(0, 0, W, H);
  }

  const vg = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  x.fillStyle = vg;
  x.fillRect(0, 0, W, H);

  // Switch indicator light in dark
  const ia = (1 - g) * (0.55 + 0.45 * Math.sin(now * 2.5));
  if (ia > 0.02){
    x.save();
    x.shadowColor = '#ffb85c';
    x.shadowBlur = 10;
    x.fillStyle = `rgba(255,184,92,${ia})`;
    x.beginPath(); x.arc(swX, swY + 28, 2.2, 0, 7); x.fill();
    x.restore();
  }

  // Aiming preview dots for user slingshot
  if (drag){
    let px = ammo.x, py = ammo.y, vx = (rest.x - ammo.x) * POW, vy = (rest.y - ammo.y) * POW;
    x.fillStyle = 'rgba(255,230,190,1)';
    for (let i = 0; i < 34; i++){
      for (let k = 0; k < 3; k++){ vy += G * 0.012; px += vx * 0.012; py += vy * 0.012; }
      if (py > floorY) break;
      x.globalAlpha = (1 - i / 34) * 0.55;
      x.beginPath(); x.arc(px, py, 2, 0, 7); x.fill();
    }
    x.globalAlpha = 1;
  }
}

/* ---------- Main Loop ---------- */
function loop(t){
  dt = Math.min(0.033, (t - lastTime) / 1000);
  lastTime = t;
  now = t / 1000;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Initial setup
resize();
ui();
startStory();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
